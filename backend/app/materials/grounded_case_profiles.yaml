  body:
    background: |-
      本案例采用公开可核验资料，不虚构机构、人物、数据或历史对话。案例主线是“中国载人航天发展战略研究及其后续工程验证”：它既是钱学森综合集成方法论被明确用于重大决策研究的真实案例，也是观察复杂工程如何从定性判断走向定量论证、再经试验与运行反馈不断修正的长期样本。[S1][S3]

      课堂不要求学生赞美既有结论，而要求像总体设计部一样工作：区分已公开事实、基于事实的分析和仍待验证的判断；把政治、经济、社会、科技与工程约束放进同一系统边界；用证据说明为什么分阶段推进、如何通过闭环反馈降低不确定性。
    narrative: |-
      一、问题不是“造一艘飞船”

      载人航天发展战略首先面对的并非单一技术选型，而是“要不要搞、怎样搞、以什么节奏和技术途径搞”的综合决策。中国工程院主管期刊《中国工程科学》刊载的研究总结指出，这一问题同时涉及政治、经济、军事、社会和科技因素，研究团队遵照钱学森提出的“定性与定量相结合的综合集成方法”，结合中国国情开展论证。论文给出的核心判断是：中国载人航天不能缺席，也不能脱离国情盲目铺开，应从飞船起步、平稳发展。[S1] 这段结论不是课堂虚构情节，而是已公开的研究成果。

      如果只按还原论思路把问题拆给若干专业组，各组可能分别给出技术可行、经济承压、战略必要或风险过高的局部结论，却无法自然产生整体方案。钱学森所说的综合集成，正是把专家体系、信息与知识体系、计算机体系有机结合：先汇集多领域经验形成定性认识，再用模型、数据、比较和试验把判断推向定量，最后回到整体目标进行综合。这个过程不是一次性的直线流程，而是循环往复、逐次逼近；承担总体分析、总体论证、总体设计和总体协调的实体是总体设计部。[S2]

      总体设计部也不是替各专业直接作答，而是围绕总体目标组织信息交换、方案比较和矛盾协调。专家经验必须接受数据与实践检验，计算结果也要回到真实系统中解释；一旦新证据改变约束或暴露模型偏差，就应重新组织研讨并修正方案。[S2] 因此，“集成”的对象既包括知识与技术，也包括组织过程和认识过程。

      二、战略如何变成可检验的阶段

      1992年9月，中国载人航天工程立项，并确定“三步走”发展战略：第一步掌握载人天地往返并开展空间应用实验；第二步突破出舱活动、交会对接等技术并建设空间实验室；第三步建造空间站，解决较大规模、长期有人照料的空间应用问题。[S3] 从系统工程角度看，这不是把终极目标切成三个互不相干的项目，而是把高不确定性目标转化为可以逐阶段验证的能力链。前一步的飞行结果、技术状态与组织经验，成为后一步是否启动和如何设计的反馈信息。

      工程公开历程呈现了这种闭环。空间实验室阶段验证货物运输、航天员中长期驻留、推进剂补加和地面长时间支持等能力；进入空间站任务前，又经过综合论证和方案设计。2012年，空间站首先被当作一个整体进行系统方案设计，形成对各舱段的技术要求，再由天和、问天、梦天等舱段并行开展详细设计、试验和验证。[S3][S5][S8] “整体—分解—再集成”在这里不是课本框图，而是需求如何向分系统传递、分系统结果如何回到总体的真实过程。

      三、局部成功不等于系统成功

      天宫空间站采用三舱T字基本构型。官方资料说明，工程突出多舱段航天器的系统统一，按照三舱组合体进行一体化设计、统筹研制、集成验证。天和承担统一管理和控制，问天具备平台功能的系统级备份与应急接管能力，梦天强化载荷支持和自主能力；三舱功能有分工，也有适度冗余。[S4] 对学生而言，关键不是背诵舱段名称，而是理解总体目标如何同时约束功能分配、安全、资源利用、接口和扩展能力。

      单个舱段通过试验仍不能证明组合体一定可靠。公开资料列出了静力、模态、振动、噪声、真空热等试验，也记录了两次三舱联试和舱段转位专项试验。三舱联试用于验证接口匹配、功能融合设计、组合体飞行方案与程序；核心舱入轨后又开展约一年的关键技术验证，神舟十三号返回后对验证情况进行全面评估，再决策转入建造阶段。[S5] 这构成一条清晰反馈链：总体假设形成方案，分系统研制产生数据，地面集成试验发现接口问题，在轨验证检验真实环境，阶段评估再决定下一步。任何节点发现重大偏差，都应反馈到前序判断，而不是为了维持计划而忽略证据。

      “闭环”也体现在空间站自身的物质与控制过程中。中国载人航天工程总设计师周建平介绍，长期在轨要求尽可能循环利用水和氧气：冷凝水和尿液经处理转化为再生水，循环水用于电解制氧，二氧化碳净化与后续反应进一步提高物资利用闭环度、降低对地面补给的依赖。[S7] 这一事实让学生看到，闭环不是管理文本中的箭头，而是系统输入、处理、输出、状态监测与反馈控制共同决定的工程能力。与此同时，机械臂、能源、出舱活动等关键技术必须在核心舱阶段接受真实环境验证；局部设备性能、航天员操作和组合体状态相互影响，不能只用单一指标评价系统是否成熟。[S7]

      四、把“灵魂人物”放回真实历史

      本案例的核心人物是钱学森，但不编造他的会议发言或私人故事。中国科学院资料显示，他在艰难条件下参与开创我国火箭、导弹和航天事业，也推动形成具有中国特色的系统工程管理方法；后来又提出开放复杂巨系统、从定性到定量的综合集成方法和综合集成研讨厅体系。[S2] 他的价值不只在于给出一个术语，更在于把科学报国、实事求是和组织协同落实为可操作的方法。资料记载，他把科技工作者的生命目的概括为为人民服务。[S2] 课程思政因此不应成为正文末尾的口号，而应落实为三条工作准则：重大决策服务国家与人民需要；面对复杂性尊重多学科证据；总体目标面前既发挥个人专长，又接受系统协调。

      2022年底，中国空间站全面建成，“三步走”战略目标完成，工程转入应用与发展阶段。[S3] 这并不意味着方法论失去作用。2024年公布的空间科学中长期规划把空间站运营、载人月球探测以及多项跨学科空间科学任务纳入后续路线图。[S6] 新任务仍需以数据、模型、试验和运行反馈持续修正判断；综合集成方法也已延伸到社会治理和信息空间科学决策研究。[S9][S10]

      五、课堂任务

      现在，各小组组成一个课堂“综合集成研讨厅”。这只是教学角色，不冒充真实历史会议。战略组负责国家需求与发展节奏，工程组负责能力链、接口和安全，资源组负责成本与条件约束，科学应用组负责长期价值，综合组负责把分散判断形成整体方案。所有主张必须引用[S1]—[S6]中的事实，推断必须明确标注为推断。目标不是猜测当年未公开的细节，而是用同一组可靠材料体验：专家判断怎样形成定性假设，证据怎样支持或否定假设，反馈怎样推动方案逐次逼近。
    decision_point: |-
      以“2030年前实施中国人首次登陆月球”的公开目标为迁移情境。[S3] 请各组依据综合集成方法设计一页研究方案：①界定总体目标、系统边界和至少四类专家；②列出已知事实、待验证假设及所需数据；③画出“定性研讨—定量验证—综合判断—试验/运行反馈—方案修正”闭环；④说明出现哪三类证据时必须调整方案。不得补写未公开的工程参数、预算、事故或人物对话。
  characters:
    - name: 钱学森
      role: 方法论奠基者（真实人物）
      stance: 从整体出发，推动专家、知识信息和计算工具综合集成，以实践反馈逐次逼近。
    - name: 战略与政策组
      role: 课堂模拟角色
      stance: 论证国家需求、发展节奏、外部环境和长期价值；只使用公开事实。
    - name: 工程技术组
      role: 课堂模拟角色
      stance: 分析能力链、系统接口、验证路径、安全与冗余。
    - name: 综合集成组
      role: 课堂模拟角色
      stance: 区分事实与判断，组织定性研讨、定量验证和反馈修正，形成总体建议。
  discussion_questions:
    - level: 理解
      question: 依据[S1][S2]，综合集成方法与“把多个专家意见放在一起”有什么本质区别？
      teaching_intent: 识别人机结合、定性到定量、总体设计部和循环反馈。
    - level: 分析
      question: “三步走”如何把高不确定性的长期目标转化为可验证的能力链？请用[S3][S5]建立反馈图。
      teaching_intent: 将阶段规划理解为学习闭环，而非时间表记忆。
    - level: 分析
      question: 为什么单舱试验通过仍不足以证明空间站组合体可靠？三舱联试解决的是哪些总体问题？
      teaching_intent: 理解局部最优、接口风险与系统涌现。
    - level: 评价
      question: 如何评价“适度规模、适度冗余”的总体设计取舍？哪些证据可以支持或反驳判断？
      teaching_intent: 训练基于证据的多目标权衡。
    - level: 创造
      question: 面向载人月球探测目标，设计一轮综合集成研讨与验证闭环，并标注事实、假设和反馈触发条件。
      teaching_intent: 迁移方法论解决前沿复杂工程问题。
  instructor_guide:
    key_points:
      - 综合集成不是简单汇总，而是专家、知识信息和计算体系的人机结合。
      - 从定性到定量是循环往复、逐次逼近的过程，反馈用于修正系统边界、模型和方案。
      - 总体设计先于分系统设计，集成试验和在轨验证用于检验接口与整体功能。
      - 课程思政落实为科学报国、实事求是、集体协同和总体责任，不编造煽情故事。
    common_misconceptions:
      - 把综合集成等同于召开专家座谈会。
      - 把“三步走”理解为静态时间表，忽略阶段验证与反馈决策。
      - 用空间站最终成功倒推每个早期判断必然正确。
      - 为增强感染力虚构钱学森讲话、工程事故、内部数据或历史对话。
  course_ideology:
    figure: 钱学森
    themes: [科学报国, 为人民服务, 实事求是, 集体协同, 自主创新]
    implementation: 通过真实人物、可核验贡献和工程方法呈现价值观，不虚构对白或煽情桥段。

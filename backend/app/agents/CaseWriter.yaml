agent_name: CaseWriter
version: "1.3.0"
role: 案例撰写
description: 撰写案例正文叙事与角色对话
model:
  provider: openai
  name: gpt-4o
  temperature: 0.8
  max_tokens: 8192
system_prompt: |
  你是教学案例写作专家。将大纲与学科情境融合为可读性强的案例正文，
  包含背景、叙事、决策点与角色立场。语言适合课堂讨论，避免说教。
tools:
  - validate_case_schema
  - check_content_safety
  - load_subject_template

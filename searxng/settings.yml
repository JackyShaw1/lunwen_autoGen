use_default_settings:
  engines:
    keep_only:
      - 360search
      - baidu
      - sogou
      - quark
      - bing
      - duckduckgo

general:
  instance_name: "CaseAutoGen 内置检索"
  debug: false

search:
  safe_search: 1
  autocomplete: ""
  default_lang: "zh-CN"
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true

outgoing:
  request_timeout: 8.0
  max_request_timeout: 15.0

engines:
  - name: 360search
    disabled: false
    weight: 2
  - name: baidu
    disabled: false
    weight: 2
  - name: sogou
    disabled: false
    weight: 2
  - name: quark
    disabled: false
    weight: 2
  - name: bing
    disabled: false
    weight: 1
    base_url: https://cn.bing.com
  - name: duckduckgo
    disabled: false
    weight: 1
